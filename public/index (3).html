<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VLT Pipeline Monitor</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
body{font-family:'Inter',sans-serif;background:#09090b;color:#e4e4e7}
.font-mono{font-family:'JetBrains Mono',monospace}
.pulse-dot{animation:pr 2s ease-in-out infinite}
@keyframes pr{0%,100%{opacity:1}50%{opacity:.4}}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#18181b}
::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:3px}
.img-thumb{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px;border:1px solid #27272a}
.drop-zone{border:2px dashed #3f3f46;border-radius:12px;transition:all .2s}
.drop-zone:hover,.drop-zone.drag-over{border-color:#8b5cf6;background:rgba(139,92,246,.05)}
.gallery-img{width:100%;object-fit:cover;border-radius:8px;border:1px solid #27272a;transition:transform .2s}
.gallery-img:hover{transform:scale(1.02)}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid #52525b;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;cursor:pointer}
.chk:hover{border-color:#8b5cf6}
.chk.on{background:#8b5cf6;border-color:#8b5cf6}
.num-input{width:56px;background:#18181b;border:1px solid #3f3f46;border-radius:6px;padding:2px 8px;color:#e4e4e7;font-family:'JetBrains Mono',monospace;font-size:12px;text-align:center}
.num-input:focus{outline:none;border-color:#8b5cf6}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#18181b;border:1px solid #3f3f46;border-radius:16px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto}
.form-input{width:100%;background:#09090b;border:1px solid #3f3f46;border-radius:8px;padding:10px 12px;color:#e4e4e7;font-size:13px;font-family:'Inter',sans-serif}
.form-input:focus{outline:none;border-color:#8b5cf6}
.form-input::placeholder{color:#52525b}
textarea.form-input{resize:vertical;min-height:100px;font-size:12px;line-height:1.6}
.form-label{display:block;font-size:11px;color:#a1a1aa;margin-bottom:4px;font-weight:500;text-transform:uppercase;letter-spacing:0.05em}
.btn-primary{padding:10px 20px;background:#7c3aed;color:white;font-size:13px;font-weight:600;border:none;border-radius:8px;cursor:pointer;transition:background .15s}
.btn-primary:hover{background:#6d28d9}
.btn-secondary{padding:10px 20px;background:#27272a;color:#a1a1aa;font-size:13px;font-weight:500;border:1px solid #3f3f46;border-radius:8px;cursor:pointer;transition:all .15s}
.btn-secondary:hover{background:#3f3f46;color:#e4e4e7}
.btn-green{padding:12px 24px;background:#059669;color:white;font-size:14px;font-weight:600;border:none;border-radius:10px;cursor:pointer;width:100%;transition:background .15s}
.btn-green:hover{background:#047857}
.toast{position:fixed;bottom:24px;right:24px;background:#059669;color:white;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:99;animation:fadeInUp .3s}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

async function apiCall(path,method='GET',body=null){
 try{
  const opt={method,headers:{'Authorization':'Bearer '+API.token,'Content-Type':'application/json'}};
  if(body)opt.body=JSON.stringify(body);
  const r=await fetch(API.url+path,opt);
  API.connected=r.ok;API.lastCheck=new Date();
  return await r.json();
 }catch(e){API.connected=false;API.lastCheck=new Date();return null}
}

async function approveGate(){const p=P();if(!p||!p.gate)return;

 // kirim ke Hermes lewat API (kalau task_id ada)

 if(ok){
  const st=p.steps[p.gate.step];if(st)st.st='done';
  const next=STEPS.find(s=>s.s>p.gate.step);if(next)p.steps[next.s]={st:'running'};
  p.events.push({t:new Date().toTimeString().slice(0,5),m:`Step ${p.gate.step} disetujui${note?' \u2014 '+note:''}${p.gate.task_id?' (dikirim ke Hermes)':''}`,ty:'done'});
  p.gate=null;render();
 }else{

 }}

function showToast(msg){
 const el=document.getElementById('toast');
 el.innerHTML=`<div class="toast">${msg}</div>`;
 setTimeout(()=>el.innerHTML='',4000)}

// ═══ PROFILE & AUTH ═══
function toggleProfile(){
 const m=document.getElementById('profile-menu');
 if(!m)return;
 m.style.display=m.style.display==='none'?'block':'none';
}
document.addEventListener('click',function(e){
 const w=document.getElementById('profile-wrap');
 const m=document.getElementById('profile-menu');
 if(w&&m&&!w.contains(e.target))m.style.display='none';
});
function doLogout(){
 sessionStorage.removeItem('vlt_auth');
 const ls=document.getElementById('login-screen');
 if(ls){ls.style.display='flex';document.getElementById('login-user').value='';document.getElementById('login-pass').value='';
  const err=document.getElementById('login-err');if(err)err.style.display='none';}
 const m=document.getElementById('profile-menu');if(m)m.style.display='none';
}
function changePassword(){
 const m=document.getElementById('profile-menu');if(m)m.style.display='none';
 document.getElementById('modal').innerHTML=`<div class="modal-bg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()" style="max-width:400px">
  <div class="p-4 border-b border-zinc-800 flex items-center justify-between">
   <div class="text-sm font-semibold text-zinc-100">Ganti Password</div>
   <button onclick="closeModal()" class="text-zinc-500 hover:text-zinc-300 text-lg px-2">\u2715</button></div>
  <div class="p-4 space-y-3">
   <div><label class="form-label">Password Lama</label><input id="cp-old" type="password" class="form-input" placeholder="Masukkan password lama"/></div>
   <div><label class="form-label">Password Baru</label><input id="cp-new" type="password" class="form-input" placeholder="Password baru"/></div>
   <div><label class="form-label">Konfirmasi Password Baru</label><input id="cp-confirm" type="password" class="form-input" placeholder="Ketik ulang password baru"/></div>
   <div id="cp-err" style="display:none" class="text-xs text-red-400 text-center"></div>
   <button onclick="savePassword()" class="btn-primary w-full mt-2">Simpan Password</button></div></div></div>`}
function savePassword(){
 const old=document.getElementById('cp-old').value;
 const nw=document.getElementById('cp-new').value;
 const cf=document.getElementById('cp-confirm').value;
 const err=document.getElementById('cp-err');
 if(old!==window._currentPw){err.textContent='Password lama salah';err.style.display='block';return}
 if(nw.length<6){err.textContent='Password baru minimal 6 karakter';err.style.display='block';return}
 if(nw!==cf){err.textContent='Konfirmasi password tidak cocok';err.style.display='block';return}
 window._currentPw=nw;
 closeModal();showToast('\u2705 Password berhasil diganti');}
window._currentPw='Joviandi@8331';

render();
checkApi();
</script>
